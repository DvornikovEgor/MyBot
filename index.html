<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBot — локальный ИИ</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --user: #3b82f6;
      --bot: #334155;
      --border: #334155;
      --danger: #ef4444;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(139, 92, 246, .18), transparent),
        radial-gradient(900px 500px at 0% 110%, rgba(59, 130, 246, .18), transparent),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .app {
      width: min(920px, 100%);
      height: min(88vh, 780px);
      display: flex;
      overflow: hidden;
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--panel), #172033);
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
    }
    .sidebar {
      width: 250px;
      background: rgba(15, 23, 42, .6);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 22px 18px;
      gap: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 42px; height: 42px;
      border-radius: 13px;
      display: grid; place-items: center;
      font-weight: 800; font-size: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 10px 24px rgba(99, 102, 241, .35);
    }
    .brand h1 { font-size: 18px; margin: 0; }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .status {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted);
      background: rgba(30, 41, 59, .6);
      padding: 9px 11px; border-radius: 10px;
      border: 1px solid var(--border);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, .15); }
    .hint { font-size: 12px; line-height: 1.6; color: var(--muted); }
    .hint b { color: #cbd5e1; font-weight: 600; }
    .btn {
      border: 0; border-radius: 10px;
      padding: 11px 14px; font-size: 14px; font-weight: 600;
      color: #f8fafc; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 20px rgba(99, 102, 241, .25);
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); box-shadow: none; font-weight: 500;
    }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chathead {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .chathead .name { font-size: 15px; font-weight: 700; }
    .chathead .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #334155; font-size: 17px; }
    .who { display: flex; align-items: center; gap: 12px; }
    .messages {
      flex: 1; overflow-y: auto; padding: 22px;
      display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
    }
    .row { display: flex; gap: 9px; max-width: 86%; }
    .row.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble {
      padding: 11px 15px; border-radius: 14px; line-height: 1.5;
      font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
      border: 1px solid var(--border);
    }
    .row.user .bubble {
      background: linear-gradient(135deg, var(--user), #2563eb);
      border-color: transparent; color: white;
      border-bottom-right-radius: 4px;
    }
    .row.bot .bubble {
      background: var(--bot); color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .row.user .meta { text-align: right; }
    .typing {
      display: inline-flex; gap: 4px; align-items: center; padding: 5px 2px;
    }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: blink 1.1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .18s; }
    .typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    .composer { display: flex; gap: 10px; padding: 16px 20px 18px; border-top: 1px solid var(--border); align-items: flex-end; }
    textarea {
      flex: 1; resize: none; min-height: 46px; max-height: 140px;
      background: rgba(15, 23, 42, .65); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; font-size: 14px; font-family: inherit; outline: none;
      transition: border .15s ease, box-shadow .15s ease;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, .2); }
    .send {
      width: 54px; height: 46px; border: 0; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; font-size: 20px; display: grid; place-items: center;
      transition: filter .12s ease, transform .12s ease;
    }
    .send:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      padding: 12px 18px; border-radius: 12px; font-size: 14px; opacity: 0;
      pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .4);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 720px) {
      .app { flex-direction: column; height: 94vh; }
      .sidebar { width: 100%; flex-direction: row; align-items: center; flex-wrap: wrap; justify-content: space-between; border-right: 0; border-bottom: 1px solid var(--border); padding: 14px 16px; }
      .hint { display: none; }
      .brand p { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <h1>MyBot</h1>
          <p>локальный собеседник</p>
        </div>
      </div>
      <div class="status">
        <span class="dot"></span> Работает офлайн · без API
      </div>
      <div class="hint">
        Напиши <b>«привет»</b>, спроси <b>«как дела?»</b>.<br/>
        Я помню твоё имя, умею считать<br/>
        <b>2+2*10</b>, знаю время, дату, умею шутить.<br/>
        Скажи <b>«меня зовут …»</b> — запомню!
      </div>
      <button class="btn ghost" id="resetBtn" type="button">↺ Сбросить память</button>
    </aside>

    <section class="main">
      <header class="chathead">
        <div class="who">
          <div class="avatar">🤖</div>
          <div>
            <div class="name" id="botName">Мира</div>
            <div class="sub">локальный ИИ без ошибок</div>
          </div>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="Напиши сообщение…" autocomplete="off"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Отправить">➤</button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast">Сообщение не отправлено. Проверь сервер.</div>

  <script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toast = document.getElementById('toast');

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messages.scrollTop = messages.scrollHeight;
      });
    }

    function timeNow() {
      return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, who) {
      const row = document.createElement('div');
      row.className = 'row ' + who;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = who === 'bot' ? 'Мира · ' + timeNow() : timeNow();

      const wrap = document.createElement('div');
      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      row.appendChild(wrap);
      messages.appendChild(row);
      scrollToBottom();
      return row;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.id = 'typing';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    async function api(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      return await res.json();
    }

    async function send(message) {
      if (!message.trim()) return;
      addMessage(message, 'user');
      input.value = '';
      input.style.height = 'auto';
      input.disabled = true;
      sendBtn.disabled = true;
      showTyping();

      try {
        const data = await api('/api/chat', { message });
        const reply = (data && data.reply) ? String(data.reply) : 'Пустой ответ? Попробуй ещё раз.';
        addMessage(reply, 'bot');
        if (data && data.state && data.state.user_name) {
          document.getElementById('botName').textContent = 'Мира';
        }
      } catch (err) {
        showToast('Не удалось связаться с ботом: ' + (err && err.message ? err.message : 'ошибка сети'));
        addMessage('⚠ Что-то пошло не так, но я на связи. Попробуй ещё раз!', 'bot');
      } finally {
        hideTyping();
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      send(input.value);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(input.value);
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    resetBtn.addEventListener('click', async () => {
      try {
        await api('/api/reset');
        showToast('Память сброшена');
        addMessage('Память очищена. Начнём заново! 🧹', 'bot');
      } catch (err) {
        showToast('Не удалось сбросить память');
      }
    });

    // Приветствие при загрузке.
    addMessage('Привет! Я Мира — локальный ИИ без интернета и внешних API. Давай пообщаемся! Напиши «меня зовут …», и я запомню твоё имя.', 'bot');
    input.focus();
  </script>
</body>
</html>
